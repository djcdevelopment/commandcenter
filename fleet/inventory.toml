# ============================================================================
# Fleet reachability inventory -- canonical, OMEN-side.
# ============================================================================
# THE source of truth for HOW to reach every node on the fleet network.
#
# Why it lives here (OMEN / C:\work\commandcenter) and not on the conductor:
# OMEN is the durable host (the Hyper-V hypervisor, always up). The conductor is
# rebuildable and can be down -- exactly when you MOST need to know what's reachable.
# OMEN is also the best vantage point: it can see the tailnet (100.x via Tailscale)
# AND its own Hyper-V VM siblings (mshome.net / 172.x) at the same time.
#
# Relationship to the conductor's fleet.json:
#   - fleet.json  = the conductor's auto-maintained BUILD-POOL view (which nodes are
#     workers/assay, mcp_ready, excluded). It churns as builds run.
#   - this file   = the stable REACHABILITY superset (addresses, how-to-reach, which
#     services should answer on which ports). It changes rarely.
# Different jobs. Don't fold one into the other.
#
# Consumed by: fleet/fleet_ping.py (health sweep CLI) and hearth/scheduler
# (builder locality, see below). Parsed with stdlib tomllib (Python 3.11+); no
# PyYAML dependency by design (repo is stdlib-only).
#
# `runner_class` (optional, per builder node): "local" | "frontier" — which token
# economy the node's build runner spends (2026-07-11). This is the OMEN-reachable
# projection of each node's ~/fleet-worker-node/runner.json (openai -> a local
# backend = "local"; no runner.json -> the worker defaults to the metered claude
# runner = "frontier"). hearth/scheduler derives machine kinds and the hindsight
# regret assay's local-vs-metered classification from it — keep it in sync when a
# node's runner.json changes.
#
# Addressing model (Derek, 2026-07-02): VMs never join the tailnet -- only physical
# hosts hold tailnet identities. Same-host VMs are reached via mshome.net sibling DNS;
# off-host VMs via a ProxyJump through their tailnet-member hypervisor.
#
# Addressing model v2 (Derek, 2026-07-09, ADR-0014): MACHINE lanes never ride the
# tailnet at all. HEARTH/mechnet machine-to-machine traffic uses mshome.net (VMs)
# or the home LAN 192.168.12.0/24 (physical AM4). Tailscale remains only for
# HUMAN/roaming access (phone, i5) and the AM4 gallery Funnel — never in the
# control loop. Trigger: Tailscale SSH "check" mode blocked the conductor lane
# pending a browser re-auth (2026-07-09).
# ============================================================================

[meta]
tailnet = "tail8e749c.ts.net"
hyperv_host = "omen"
updated = "2026-08-20"
ssh_user = "claude"          # default ssh user for reachability/health probes

# --- Physical hosts (tailnet members) ---------------------------------------

[[node]]
name = "omen"
kind = "physical-host"
address = "omen.mshome.net"
alt = ["100.124.12.37"]   # tailnet identity stays (i5/phone reach it from another project)
via = "mshome"
expect = "up"
purpose = "Hyper-V hypervisor + HEARTH gateway (:8710) + omen-arc rung (llama-server :8082, dual Arc Pro B70, ADR-0034) + Ollama (:11434 loopback for the door, :11435 tracing proxy for the fleet; demoted CPU-only since the 5070 left in the 2026-08-20 rebuild). Hosts all builder VMs. THIS box."
# `revive` (optional, per-check): a shell command the watchdog runs when this
# service is down on an expect="up" node. Since ADR-0015 the watchdog is an
# in-gateway daemon timer (the old mechnet-watchdog scheduled task is deregistered).
# The gateway revive is the proven doorcheck --revive (verified 2026-07-04, 322ab7d).
# Ollama has TWO lanes on OMEN and they are NOT interchangeable (verified 2026-08-20):
#   :11434 is bound to 127.0.0.1 ONLY -- OllamaBoot runs `ollama.exe serve` with
#     OLLAMA_HOST unset, so it defaults to loopback. This is the HEARTH door's own
#     lane; the gateway runs on OMEN, so loopback is all it needs.
#   :11435 is the FLEET-facing lane -- OmenOllamaTracingProxy (scheduled task,
#     C:\Users\derek\omen-otel-proxy\proxy.py) listens on 0.0.0.0:11435 and fronts
#     Ollama with OTel tracing. VMs MUST use :11435.
# Probing omen.mshome.net:11434 only ever generates a false alarm -- it cannot answer.
checks = [
  { service = "llama-server", port = 8082, host = "127.0.0.1" },
  { service = "ollama-fleet", port = 11435, host = "omen.mshome.net" },
  { service = "hearth-gateway", port = 8710, host = "127.0.0.1", revive = "C:\\work\\commandcenter\\fleet-worker-node\\.venv-omen\\Scripts\\python.exe -m hearth.callers.doorcheck --revive" },
  { service = "ollama-local", port = 11434, host = "127.0.0.1" },
]

[[node]]
name = "cc-conductor"
kind = "physical-host"
address = "cc-conductor.mshome.net"
# tailnet identity REMOVED 2026-07-09 (post-ADR-0014 cleanup): node no longer appears in
# `tailscale status` — the old alts 100.74.110.91 / cc-conductor.tail8e749c.ts.net are dead.
via = "mshome"
expect = "up"
purpose = "Fleet orchestration engine: conductor daemon + api/dashboard (:8080)."
checks = [
  { service = "ssh", port = 22 },
  { service = "dashboard", port = 8080 },
]

[[node]]
name = "am4"
kind = "physical-host"
address = "192.168.12.233"
alt = ["100.116.82.60", "am4.tail8e749c.ts.net"]   # tailscale STAYS on AM4 (gallery Funnel +
   # phone/i5 access) — but HEARTH/mechnet lanes use the LAN address (ADR-0014).
   # ufw: 22 + 8090 ALLOW from 192.168.12.0/24 (8090 rule added 2026-07-09).
via = "lan"
expect = "down"   # 2026-08-20: B70s + model drive moved into OMEN; box is dark
purpose = "OFFLINE pending rebuild as a CUDA node (RTX 5070 incoming, Derek 2026-08-20). Was: AM4 inference + observability (OTel/Jaeger :16686). NOT a build VM."
checks = [
  { service = "ssh", port = 22 },
  { service = "jaeger", port = 16686 },
]

[[node]]
name = "i5-laptop"
kind = "physical-host"
address = "100.125.141.110"
alt = ["i5-laptop.tail8e749c.ts.net"]
via = "tailnet"
expect = "optional"
purpose = "Portable demo/edge node + second Valheim test client (baseline deploy target). Normally offline -- not part of the SPINE baseline."
note = "2026-07-23: push-deploy lane LIVE from C:\\work\\baseline (tools\\i5): ssh alias `i5` in OMEN ~/.ssh/config -> i5-laptop.tail8e749c.ts.net as user admin, key = OMEN id_ed25519 (already authorized on the node; host = DESKTOP-T685KEI). Deploy-ToI5.ps1 = SHA256-verified push; staging root C:\\deploy\\baseline on the node; -ValheimPlugins targets the live BepInEx plugins dir. Tailnet is the SANCTIONED lane here -- ADR-0014 reserves Tailscale for human/roaming access and names the i5 as that roamer; this is operator dev tooling, not the machine control loop. Offline stays a normal state: probe, report, never retry-loop."
checks = [
  { service = "ssh", port = 22 },
]

# --- OMEN Hyper-V VMs (mshome.net siblings) ---------------------------------

[[node]]
name = "claudefarm1"
kind = "vm"
address = "claudefarm1.mshome.net"
via = "mshome"
host = "omen"
expect = "up"
runner_class = "local"   # runner.json: openai -> OMEN Ollama
purpose = "Original golden-image VM. Worker + (temp) assay shell; hosts the omen-worker-1 builder."
note = "2026-07-04 RECOVERED. Root cause was a MAC-ADDRESS COLLISION: cc-builder-4 was stood up (2026-07-03) with a static MAC identical to this VM's golden-image MAC (both 00155D0CC700). Two VMs, same static MAC on the Default Switch -> cc-builder-4 won, claudefarm1 was knocked off the network (no lease, unreachable). Its Hyper-V DISPLAY name had also been changed to 'cc-worker-1' (guest hostname stayed 'claudefarm1'), which hid it. Fix: Stop-VM, Set-VMNetworkAdapter -StaticMacAddress 00155D0CC70A (unique), Start-VM -> got fresh lease 172.21.189.98, mshome DNS updated, sshd up, conductor reachable, omen-worker-1 UP. hv-kvp-daemon is inactive in the guest (cosmetic: host can't read guest IP via KVP, but reachability is fine). NOTE: cc-builder-4 still holds the original golden MAC 00155D0CC700 - future clones off the golden image must regenerate their MAC (see [[project-fleet-vm-provisioning]]). 2026-08-20 RENAMED + CORRECTION: the Hyper-V display name is now 'claudefarm1', matching the guest hostname (Rename-VM on the running VM -- display-name only, zero downtime, uptime preserved). The 2026-07-04 line above is wrong on one point: the display name was never *changed* to 'cc-worker-1'. HANDOFF-2026-06-27.md records the VM as cc-worker-1 from the start, and Hyper-V CreationTime is 2026-06-27 03:17 -- it was created under that label booting the golden image whose guest hostname is claudefarm1, so label and hostname never matched. That is the whole reason 'cc-worker-1.mshome.net' was always NXDOMAIN: mshome sibling DNS is registered by the GUEST over DHCP, so only 'claudefarm1' was ever registered -- there was no missing node and nothing to repair. Nothing in fleet.json, this file, or any scheduled task ever referenced 'cc-worker-1'; it existed only as a Hyper-V label. DISK (disambiguate by full path): boots C:/Users/derek/VMs/dev-vm/dev-vm.vhdx -- NOT the same-named C:/Users/derek/VMs/zen-deepseek-1/dev-vm.vhdx that cc-builder-4 boots."
checks = [
  { service = "ssh", port = 22 },
]

[[node]]
name = "cc-builder-1"
kind = "vm"
address = "cc-builder-1.mshome.net"
via = "mshome"
host = "omen"
expect = "up"
runner_class = "frontier"   # no runner.json on the node -> worker defaults to the metered claude runner
purpose = "Frontier builder VM (claude/sonnet runner)."
checks = [
  { service = "ssh", port = 22 },
]

