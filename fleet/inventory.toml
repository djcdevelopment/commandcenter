tailnet = "tail8e749c.ts.net"
hyperv_host = "omen"
updated = "2026-08-24"
# ssh_user: DOCUMENTATION ONLY -- nothing in this repo reads it (2026-08-24 audit).
# fleet_ping probes TCP ports; the watchdog's `revive` is a shell command, not a
# login. It records the convention for humans/agents who shell in by hand.
# CAVEAT: after the 2026-08-20 AM4 rebuild the `claude` key is NOT installed there
# -- `claude@192.168.12.233` gets "Permission denied (publickey)"; only `derek@`
# works. Left as-is rather than repointed: the convention is still `claude` on the
# VMs, and AM4 is the exception, not the new default.
ssh_user = "claude"          # default ssh user for reachability/health probes

