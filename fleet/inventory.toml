name = "am4-worker-1"
kind = "logical-builder"
rides_on = "am4"
model_backend = "127.0.0.1:8090"   # facade ANSWERS, but reports ready:false (2026-08-24)
via = "lan"
# expect: "optional", not "down" -- fleet_ping's classify() only knows "up" and
# "optional"; any other string behaves like a non-gating "up", so the old "down"
# silently did nothing. This node CANNOT build and must never gate the sweep.
expect = "optional"   # pending the AM4 CUDA rebuild (out of scope 2026-08-24)
runner_class = "local"   # openai runner -> oxen; NOT dispatchable while oxen is empty
# Out of the ADVISORY SCHEDULING pool, which is a different question from the sweep
# above: `expect` only says this node must not gate fleet_ping, while `schedulable`
# says the CP-SAT planner must not place work here. The exclusion used to ride on
# expect="optional" by accident; it now has its own key. Clear this when an
# inference engine is actually bound to the 5070 -- a facade that answers on :8090
# with every backend ready:false is not capacity.
schedulable = false
purpose = "NOT DISPATCHABLE, and doubly so since 2026-08-24: AM4 is powered down, so even the shell is gone. AM4 local-model builder (openai runner -> oxen facade :8090). CAUTION when AM4 is powered again -- its ssh check rides AM4, so this row flips to reachable and that proves the SHELL, not the model: the oxen facade answers with every backend ready:false, and AM4 has no CUDA stack. Shell on AM4; farmer via cc-farmer tunnel."
checks = [
  { service = "ssh", port = 22, host = "192.168.12.233" },
]

[[node]]
name = "omen-worker-1"
kind = "logical-builder"
rides_on = "claudefarm1"
model_backend = "omen.mshome.net:11435"   # Ollama qwen3-coder:30b, via the OTel tracing proxy
via = "mshome"
expect = "optional"   # PARKED 2026-08-24 (see FLEET HOLD note above); restore to "up" when the VMs restart
runner_class = "local"   # openai runner -> OMEN Ollama qwen3-coder:30b
purpose = "OMEN Ollama qwen3-coder:30b builder (54.6 tok/s). Shell rides claudefarm1 -- so it dies when claudefarm1 is down, even though its model backend (OMEN) is fine."
note = "Coupling to claudefarm1 is a fragility: OMEN's Ollama is reachable independently. Candidate to re-home its shell off claudefarm1 (see CONDUCTOR-FOLLOWUPS)."
checks = [
  { service = "ssh", port = 22, host = "claudefarm1.mshome.net" },
  { service = "ollama-fleet", port = 11435, host = "omen.mshome.net" },
]

# --- Cloud backends (no machine of our own; check host = the API endpoint) --
# First cloud-backend node on the mechnet (2026-07-12). Not a machine we own --
# no address/ssh, just an inference endpoint. The TCP check proves egress/DNS
# reachability from OMEN only; auth and quota are doorcheck's job (/checkmcp
# reads hearth/etc/backends.toml's gcp-gemini entry for the deep check).

[[node]]
name = "gcp-gemini"
kind = "cloud-backend"
via  = "internet"
expect = "optional"
model_backend = "gemini-3.5-flash"
purpose = "Vertex AI overflow lane (GCP trial credits) — backends.toml gcp-gemini"
note = "TCP probe = egress/DNS only; auth+quota truth lives in /checkmcp's backends layer (doorcheck)"
checks = [{ service = "vertex-egress", host = "aiplatform.googleapis.com", port = 443 }]
