# ============================================================================
# HEARTH inference backend pool  —  "bankedfire" (Banked Fire, P1 + P2)
# ============================================================================
# Declarative pool for hearth.toolsurface.inference.local_generate.
#
# One config file, one scheduler (Banked Fire design principle #2): the router
# reads this, and later phases (watchdog P4) read the SAME declaration. Add a
# backend here and it is routable — no code change.
#
# Parsed with stdlib tomllib (Python 3.11+); no third-party deps by design.
# Override the path with the HEARTH_BACKENDS env var. If the file is absent the
# router falls back to a built-in omen-ollama default, so the gateway never
# breaks on a missing pool file.
#
# Routing policy (see backends.py select_backend), in order:
#   1. caller-pinned endpoint  -> unchanged legacy behavior, wins outright, no occupancy check
#   2. caller-pinned backend name -> wins outright, no occupancy check (a pin is deliberate)
#      BUT a pin is still REFUSED when the payload exceeds that rung's context_bytes
#      below, and when it names a model the rung does not serve. A pin overrides
#      SCHEDULING judgment, not arithmetic: a busy rung eventually serves you out of
#      its own queue, whereas an over-budget payload never fits and dispatching it
#      only buys a failure at the server that reads like a server fault. Refusal
#      raises BackendRoutingRefusal (reason payload_over_budget_for_pinned_backend);
#      on the execution plane that lands at admission, before a Job is created.
#      => this makes every context_bytes value below load-bearing. A stale or
#      over-conservative number now BLOCKS a pin that would have worked. Re-derive
#      it whenever a rung's resident model or its -c/-np changes (ADR-0031).
#   3. tag match (task="research" -> a backend tagged "research"), occupancy-checked (P2):
#      a busy or unknown-occupancy candidate is skipped, next tag/candidate tried
#   4. fall back to `default` (never itself occupancy-gated)
# `retired = true` marks a rung whose hardware is gone. It stays declared so its
# history, revive wiring, and budgets remain readable, and so a pin still fails
# with that rung's own error rather than "unknown backend" — but it is withheld
# from list_execution_providers, which the IRC storefront and the public lab
# pages project verbatim. Declaring capacity that cannot emit a token is worse
# than declaring none.
# Occupancy probe: hearth.toolsurface.occupancy — one probe declared PER RUNG
# (am4-moe: llama-server /slots; am4-oxen: :8090 facade /health; everything else:
# no probe, always "available"), 30s cache, fail-open to "unknown" -> busy for
# opportunistic/tag-routed calls.
# ============================================================================

# Name of the backend used when nothing else matches. (Top-level keys MUST
# precede any [table] header — TOML swallows later bare keys into the table.)
# 2026-08-21 (ADR-0034): omen-arc — the dual-B70 Qwen3-30B-A3B llama-server on
# OMEN itself. Chosen by Derek from the OMEN-LIMIT-TEST-2026-08 bake-off
# scorecard: 95 tok/s single-stream, 116 aggregate at -np 4, p95 4.1 s.
default = "omen-arc"

# A4: shared GCP trial-credit runway. Burn is measured from
# knowledge/offload.json (per_class.trial, input+output); when burn crosses
# budget - reserve, every cost_class="trial" rung leaves opportunistic routing
# (tag/fallback) until credits are topped up. Pins still work — a pin is
# deliberate. Both are operational knobs; tune as the trial pool changes.
[trial]
budget_tokens  = 200000000
reserve_tokens = 20000000

[[backend]]
name     = "omen-arc"                         # THE DOOR DEFAULT (ADR-0034, 2026-08-21):
                                              # Qwen3-30B-A3B-Instruct-2507 Q4_K_M dual-split
                                              # across OMEN's two Arc Pro B70s, llama.cpp
                                              # b10549 Vulkan, native Windows. Proven in the
                                              # OMEN-LIMIT-TEST-2026-08 campaign: Q4 200-row
                                              # CV 2.3%, zero TDR/WHEA over ~6.5 h soak.
endpoint = "http://127.0.0.1:8082"            # loopback; port mirrors the old moe convention
api      = "openai"                           # /v1/chat/completions
auth_env = "OMEN_ARC_TOKEN"                   # REQUIRED even on loopback (inference.py gates
                                              # api="openai" on a present bearer); set in
                                              # hearth/var/gateway.cmd and passed to
                                              # llama-server as --api-key by serve-arc.cmd.
models   = ["qwen3-30b-a3b"]                  # served via --alias qwen3-30b-a3b
tags     = ["default", "code", "big-context", "research", "second-opinion", "reasoning"]
# Occupancy: llama-server /slots probe (occupancy.probe_omen_arc_slots), same
# goodput policy as the old moe rung: all slots busy -> opportunistic traffic
# skips; pinned calls wait in llama-server's own queue.
[backend.settings]
node                = "omen"
hardware_profile_id = "omen-285k-dual-b70-2026H2"   # rebuilt box, 2026-08-20 (ADR-0027 hand-bump)
# A1 payload budget: -np 2 slots over -c 131072 => 64k tokens per slot; ~57k of
# that as payload at the ~4 bytes/token convention (same arithmetic as the old
# am4-moe rung). Serving flags per the campaign: -sm layer -ts 1,1 -fa on
# (rung ctx is past the 16-24k FA crossover) -fit off --no-mmap.
#
# 2026-08-24: widened 16k -> 64k per slot for Nous Hermes Agent, which refuses
# any model offering under 64000 tokens per conversation. This MUST track
# serve-arc.cmd's -c/-np: llama-server never rejects an over-long prompt, it
# silently truncates it (measured 2026-07-18: a 17.5k request against a 16k slot
# returned ok with normal timing), so context_bytes is the only real guard.
# Slots halved 4 -> 2 because -c 262144 -np 4 SPILLED (10.24 GB shared, -22%
# throughput); -c 131072 -np 2 is clean at 0.24 GB and 109.31 tok/s.
context_bytes = 229376
max_tokens = 8192
timeout_s = 1000
# 2 slots (was 4): 64k-deep slots cost more than the knee ladder predicted —
# that ladder varied -c via -np at a fixed 8192/slot, so it never sampled slot
# depth and is blind to attention compute buffers. Re-run the shared-usage
# assert after any -c/-np change.
parallel_slots = 2

[[backend]]
name     = "omen-arc-oss"                     # BANKED FIRE (pin-only, NOT resident):
                                              # gpt-oss-120b MXFP4 dual-split on the same
                                              # two B70s. No tags — light it deliberately
                                              # (fleet/arcserve/serve-arc-oss.cmd), then pin
                                              # backend="omen-arc-oss". Bake-off numbers:
                                              # 14.7 tok/s single-stream, p95 25-32 s at
                                              # -np 4 -c 65536 (0.9 GiB non-local — prefer
                                              # q8-KV at 65k, tax measured at ~5-6%).
                                              # MUTUAL EXCLUSION with omen-arc is NOT
                                              # enforced (the am4 lesson): stop the resident
                                              # rung first or both degrade.
endpoint = "http://127.0.0.1:8083"
api      = "openai"
auth_env = "OMEN_ARC_TOKEN"
models   = ["gpt-oss-120b"]
tags     = []                                 # pin-only by design
[backend.settings]
node                = "omen"
hardware_profile_id = "omen-285k-dual-b70-2026H2"
context_bytes = 57344
max_tokens = 12288                            # reasoning-format model (harmony channels):
                                              # generous output cap, not a charge
timeout_s = 1000
parallel_slots = 4

[[backend]]
name     = "omen-arc-27b"                     # DEPTH SPECIALIST (pin-only, NOT resident),
                                              # ADR-0039. Qwen3.8-27B dense, dual-split on
                                              # the same two B70s. The campaign verdict was
                                              # do_not_promote as DEFAULT (−31% jobs/hour at
                                              # p512) — but the ratio inverts with depth:
                                              # 2.63× the incumbent at 8K prompts, 5.49× at
                                              # 32K, 95.6% blind win-or-tie. Pin it for
                                              # deep-context files= packs, long-horizon
                                              # analysis. MTP OFF (temp-0 divergence open,
                                              # ADR-0038) and TEXT ONLY (vision decode
                                              # anomaly open) until those decisions close.
                                              # Serving costs a model swap: light via the
                                              # rotation lane (llama-swap, pending ADR-0040)
                                              # or the campaign's proven qwen27-dual-
                                              # production shape. MUTUAL EXCLUSION with
                                              # omen-arc / omen-arc-oss is NOT enforced —
                                              # stop the resident rung first or both degrade.
endpoint = "http://127.0.0.1:8084"
api      = "openai"
auth_env = "OMEN_ARC_TOKEN"
models   = ["qwen38-27b"]
tags     = []                                 # pin-only by design (ADR-0039)
[backend.settings]
node                = "omen"
hardware_profile_id = "omen-285k-dual-b70-2026H2"
# ADR-0031 arithmetic, same shape as omen-arc: -c 131072 -np 2 → 2 slots × 65536
# tokens × ~3.5 bytes/token. Derived, not copied; retune if the serve shape changes.
context_bytes = 229376
max_tokens = 8192
timeout_s = 1000
parallel_slots = 2

[[backend]]
name     = "fx99-ollama"                      # CUDA SIDECAR (pin-only), ADR-0039: the
                                              # monitoring node's RTX 2070 SUPER + stock
                                              # Ollama, enlisted 2026-08-28 (Derek chose
                                              # this over reopening the AM4-5070 ruling).
                                              # Light-duty 7–14B seats: critic/utility
                                              # calls, small-model judge panel seats, and
                                              # the designated cheap local fallback when
                                              # OMEN is in a maintenance window (stops dark
                                              # windows leaking to metered/trial cloud).
                                              # Verified live 2026-08-28: 12 resident
                                              # models, /api/tags answers. NOT a
                                              # rehabilitation of the dead am4 rungs — 8 GB
                                              # VRAM, wireless-class LAN, keep payloads
                                              # small.
endpoint = "http://192.168.12.220:11434"
api      = "ollama"                           # /api/generate
models   = ["qwen2.5:7b", "qwen2.5-coder:7b", "qwen2.5:14b", "llama3.1:8b", "gemma2:9b", "deepseek-r1:8b"]
tags     = []                                 # pin-only until R8/R9 score these seats
[backend.settings]
node                = "fx99"
hardware_profile_id = "fx99-2070super-2026H2"
# Conservative: Ollama default num_ctx 8192 → ~8k tokens × ~3 bytes. Widen only
# after measuring a larger num_ctx on the 2070 SUPER.
context_bytes = 24576
timeout_s = 300

[[backend]]
name     = "omen-ollama"                      # DEMOTED from routing 2026-08-21 (ADR-0034):
                                              # the RTX 5070 left OMEN in the rebuild and
                                              # stock Ollama on Arc silently serves CPU-only
                                              # (proven May 2026, re-observed 2026-08-20 as
                                              # the "commit thief": resident CPU runners
                                              # holding 65 GB). Pin-only until an
                                              # Arc-accelerated Ollama path is validated.
# ⚠ NOT RUNNING, verified 2026-08-24: :11434 does not listen and the OllamaBoot
# scheduled task is Disabled — for good, per ADR-0034, not pending a restart.
# tags=[] keeps opportunistic routing off it, so this costs nothing day to day,
# but an explicit backend="omen-ollama" PIN will fail at connect. Reviving it
# means re-enabling OllamaBoot, and the ollama-sentinel entry in
# HEARTH_TIMERS_DISABLE exists because its generate probe kept resurrecting the
# 17.4 GB commit thief — lift that hold deliberately, together, or not at all.
endpoint = "http://127.0.0.1:11434"
api      = "ollama"                          # /api/generate
models   = ["qwen3-coder:30b"]
tags     = []                                # was ["default", "code"] — stripped with the demotion
revive   = "start_ollama"                    # HEARTH summon tool (consumed in P4)
# retired 2026-08-24: :11434 does not listen and OllamaBoot is Disabled for good.
retired  = true
# NOTE 2026-08-21: OllamaBoot is DISABLED and STAYS disabled (Derek: "more
# headaches than it's saved" — tray-updater wars, zombie installs, the 65 GB
# commit thief). A pin needs a deliberate `Start-ScheduledTask OllamaBoot`
# first; serving is CPU-only on this hardware regardless.
[backend.settings]
# ADR-0027: `node` is the machine that EXECUTES a dispatch, stamped as builder_id on
# capacity observations. Distinct from the caller (which becomes workflow_id) on purpose:
# the association engine counts distinct workflows for independence and distinct
# builders/models for variation, so feeding both the same field collapses two gates into
# one. `hardware_profile_id` keeps a capability from silently spanning a hardware change;
# bump it BY HAND when the box changes.
node                = "omen"
hardware_profile_id = "omen-285k-dual-b70-2026H2"   # bumped 2026-08-21: the 5070-era box is gone
# A1 payload budget: ≈24k tokens of a 32k config, conservative. Payloads over
# this route past the default to a big-context/cloud rung (select_backend).
context_bytes = 98304

[[backend]]
name     = "am4-moe"                          # ☠ DEAD 2026-08-20 (ADR-0034): the B70s and
                                              # the model drive moved INTO OMEN in the
                                              # rebuild — this endpoint can never serve
                                              # again as declared. Kept as a tombstone
                                              # (tags stripped so nothing routes here);
                                              # AM4 returns later as a CUDA node with the
                                              # RTX 5070. The gpt-oss-120b role lives on
                                              # as omen-arc-oss; the config below is the
                                              # historical record of the AM4 deployment.
endpoint = "http://192.168.12.233:8082"       # AM4 over LAN (ADR-0014); llama-server binds
                                              # 0.0.0.0:8082 with --api-key bearer auth.
api      = "openai"                           # /v1/chat/completions
auth_env = "AM4_OXEN_TOKEN"                   # same token the facade lane already uses
models   = ["gpt-oss-120b"]                   # served via --alias gpt-oss-120b
tags     = []                                 # was big-context/research/second-opinion/reasoning
                                              # — all moved to omen-arc (ADR-0034)
# retired 2026-08-24: the B70s serving this rung are in OMEN; AM4:8082 is closed.
retired  = true
# Occupancy: HTTP slot/KV probe (occupancy.probe_moe_slots) — NOT the render-node
# fuser probe: this rung's own llama-server always holds both cards, so "someone
# holds the render nodes" would read permanently busy. Goodput policy: all slots
# processing (or KV cache past the pressure ceiling) -> opportunistic traffic
# skips to omen/flash; pinned calls still dispatch and WAIT IN LINE in
# llama-server's internal request queue.
[backend.settings]
# ADR-0027: `node` is the machine that EXECUTES a dispatch, stamped as builder_id on
# capacity observations. Distinct from the caller (which becomes workflow_id) on purpose:
# the association engine counts distinct workflows for independence and distinct
# builders/models for variation, so feeding both the same field collapses two gates into
# one. `hardware_profile_id` keeps a capability from silently spanning a hardware change;
# bump it BY HAND when the box changes.
node                = "am4"
hardware_profile_id = "am4-dual-b70-2026H2"
# A1 payload budget: -np 4 slots over -c 65536 => 16k tokens per slot; ≈14k of
# that as payload at the ≈4 bytes/token convention the other rungs use.
context_bytes = 57344
# gpt-oss is a reasoning-format model (harmony channels): same generous-output
# protection the gemini rungs get — a cap, not a charge. Raised 2026-07-20 from
# 8192: at ~21 tok/s p50 that budget left too little room for the reasoning
# channel on genuinely large jobs, which came back ok:true with empty text
# (the harmony channel ate the whole cap before emitting visible output).
max_tokens = 12288
# O5 (capacity facts -> router, 2026-07-18): the wall-clock budget that MATCHES
# the output budget above. A too-short timeout is an ok:false, and on a
# tag-routed call that silently ESCALATES to a trial-credit rung (A2),
# inverting the sunk-first ladder for exactly the slow, reasoning-dense work
# this rung exists to absorb.
# Flat 1000s baseline (2026-07-21, matches DEFAULT_TIMEOUT_S in inference.py):
# set explicitly here — rather than left to fall through to the default — so
# it stays self-documenting even if the global default is retuned later.
# Superseded the individually-calculated 600s (585s implied @ ~21 tok/s p50
# for the 12288 max_tokens above); revisit both together once a few days of
# duration_ms p90/p99 (knowledge/capacity.json) give a real per-rung number.
# NOTE this must stay BELOW the MCP client's idle timeout or the client gives
# up first; .mcp.json ("hearth" server) timeout was raised to 1300000 (1300s)
# alongside this change — 300s headroom over this budget for queueing.
timeout_s = 1000
# Verified live against llama.cpp /slots on 2026-07-30 (-np 4). The execution
# scheduler uses this as the GLOBAL limit across every ingress adapter.
parallel_slots = 4

[[backend]]
name     = "am4-oxen"                          # ☠ DEAD 2026-08-20 (ADR-0034): cards moved to
                                               # OMEN; see am4-moe tombstone. Was: the banked
                                               # fire — dual-B70 Qwen3-30B
# ⚠ RE-MEASURED 2026-08-24 — this tombstone was HALF wrong, in the dangerous
# direction. The facade did NOT die with the cards: AM4 is up again and :8090
# still answers (401 bare, full model list with the bearer). What it returns is
#     {"id":"oxen-planner", ..., "ready": false}
#     {"id":"oxen-critic",  ..., "ready": false}
# i.e. the facade is alive and every llama-server behind it (127.0.0.1:8080/:8081)
# is gone. So a port probe, a /v1/models call, and a health check all SUCCEED
# against a rung that cannot generate a single token.
#
# This is why the rung stays tags=[] — routing must never select it. But note a
# PIN would also get past the door's checks and only fail at generate time, and
# AM4 has no CUDA stack for the 5070, so there is no near-term fix. Treat "8090
# is open" as evidence about the facade process, never about capacity.
endpoint = "http://192.168.12.233:8090"       # AM4 over LAN (ufw 8090 ALLOW 192.168.12.0/24,
                                              # added 2026-07-09) — machine lanes stay off the
                                              # tailnet (ADR-0014)
api      = "openai"                           # /v1/chat/completions, Bearer auth
auth_env = "AM4_OXEN_TOKEN"                   # SAME name the fleet already uses
                                              # (conductor .env; ensemble_structure.py:71).
                                              # Copy that line into hearth/var/gateway.cmd
                                              # as `set AM4_OXEN_TOKEN=...` (batch fragment,
                                              # sourced by start-hearth-gateway.cmd).
models   = ["oxen"]                           # facade-advertised id (GET /v1/models);
                                              # dual-B70 Qwen3-30B behind the oxen alias.
                                              # (was "qwen3-30b" — not a real id → 404.)
tags     = []                                 # was ["oxen-planner"]; DEMOTED from opportunistic routing —
                                              # big-context/research/second-opinion moved
                                              # to am4-moe (gpt-oss-120b holds both cards
                                              # steady-state per ADR-0018). Pin by name
                                              # for a deliberate planner run.
# TENANCY, verified live 2026-07-30 (B70-VERTICAL-TRACE.html): this rung and
# am4-moe are rival tenants of the same two cards, and mutual exclusion is NOT
# enforced anywhere — both were found running at once, with moe OOM-looping.
# Whatever holds 127.0.0.1:8080 is what a pinned oxen call actually reaches, so
# check what is resident before pinning; there is no ceremony that guarantees
# the planner is there. (The previous note here — "stop b70-moe first, then
# wake_am4" — described a handover that neither systemd nor this file enforces.)
# revive removed (was wake_am4): an auto-revive would start b70-planner INTO the
# resident moe's VRAM. wake_am4 stays available as a standalone summon tool.
# `conductor_worker`: metadata only — which conductor worker rides this backend
# (useful for humans cross-referencing fleet.json). The LIVE occupancy probe does
# NOT read this field: it goes straight to AM4 serve-truth
# (hearth.toolsurface.occupancy.check_occupancy, keyed by backend name
# "am4-oxen"), per the strategy doc's ground-truth-over-conductor-FS demotion.
# That probe is an HTTP health check of the :8090 facade as of 2026-07-30. It
# was the render-node fuser probe, which read BUSY FOREVER: whichever
# llama-server is resident holds both render nodes by design, so "someone holds
# a render node" is always true here (same reason am4-moe probes /slots).
occupancy = { conductor_worker = "am4-worker-1" }
# retired 2026-08-24: the cards left AM4; :8090 answers but every model is ready:false.
retired  = true
[backend.settings]
# ADR-0027: `node` is the machine that EXECUTES a dispatch, stamped as builder_id on
# capacity observations. Distinct from the caller (which becomes workflow_id) on purpose:
# the association engine counts distinct workflows for independence and distinct
# builders/models for variation, so feeding both the same field collapses two gates into
# one. `hardware_profile_id` keeps a capability from silently spanning a hardware change;
# bump it BY HAND when the box changes.
node                = "am4"
hardware_profile_id = "am4-dual-b70-2026H2"
# A1 payload budget: the facade fronts b70-planner at `-c 16384 -np 1` => 16k
# tokens for the ONE slot, ≈14k of it as payload at the ≈4 bytes/token convention
# — the same arithmetic as am4-moe above, which reaches the same number from
# -c 65536 across -np 4. Corrected 2026-07-30 from 114688: that claimed ≈28k of a
# single-card 32k ctx this server does not run, so a pinned ~20k-token payload
# routed as "fits" and then failed at the server (B70-VERTICAL-TRACE.html).
# Re-derive this whenever the resident model or its -c/-np changes.
context_bytes = 57344

[[backend]]
name     = "gcp-gemini"
endpoint = "https://aiplatform.googleapis.com"
api      = "gemini"                          # /v1/projects/.../models/{model}:generateContent
models   = ["gemini-3.5-flash"]
tags     = ["frontier", "deep-reasoning", "long-context", "cloud-overflow"]
# Auth uses `gcloud auth print-access-token` by default, unless this env var is
# set in the gateway process.
auth_env = "GOOGLE_OAUTH_ACCESS_TOKEN"
[backend.settings]
# ADR-0027: `node` is the machine that EXECUTES a dispatch, stamped as builder_id on
# capacity observations. Distinct from the caller (which becomes workflow_id) on purpose:
# the association engine counts distinct workflows for independence and distinct
# builders/models for variation, so feeding both the same field collapses two gates into
# one. `hardware_profile_id` keeps a capability from silently spanning a hardware change;
# bump it BY HAND when the box changes.
node                = "gcp-vertex"
# Null on purpose: Google does not tell us which hardware served the call, so
# there is no honest profile to pin. Capabilities formed on these rungs cannot
# distinguish pre- and post-hardware-change evidence, and should not pretend to.
project_env  = "GOOGLE_CLOUD_PROJECT"
location_env = "GOOGLE_CLOUD_LOCATION"       # defaults to "global" when unset
cost_class   = "trial"                       # A4: counts against [trial] runway
# Same thinking-budget protection the pro rung has: modern Gemini models can burn
# a stingy budget on hidden reasoning and return empty text; a cap not a charge.
# Matched to gcp-gemini-pro's 16384 (2026-07-21) so both gemini rungs share one
# base output budget instead of flash silently getting half the headroom.
max_tokens   = 16384
# A1 payload budget: effectively unlimited vs the 1 MiB files= pack cap.
context_bytes = 2097152

[[backend]]
name     = "gcp-gemini-pro"                   # premium sibling of gcp-gemini: same
                                              # Vertex endpoint/auth, bigger model.
                                              # Explicitly pin it — it is NOT tagged
                                              # for opportunistic routing, so the near-
                                              # free flash rung stays the trial-credit
                                              # default and pro is a deliberate reach.
endpoint = "https://aiplatform.googleapis.com"
api      = "gemini"                          # /v1/projects/.../models/{model}:generateContent
models   = ["gemini-3.1-pro-preview"]        # Gemini 3.1 Pro Preview — 1M-token context,
                                              # frontier agentic/coding, THINKING model.
tags     = ["gemini-pro"]                    # unique tag only; deliberately NOT "frontier"/
                                              # "cloud-overflow" so tag-routing keeps landing
                                              # on the cheap flash rung. Pin by name to use.
# Auth uses `gcloud auth print-access-token` by default, unless this env var is
# set in the gateway process (same convention as gcp-gemini).
auth_env = "GOOGLE_OAUTH_ACCESS_TOKEN"
[backend.settings]
# ADR-0027: `node` is the machine that EXECUTES a dispatch, stamped as builder_id on
# capacity observations. Distinct from the caller (which becomes workflow_id) on purpose:
# the association engine counts distinct workflows for independence and distinct
# builders/models for variation, so feeding both the same field collapses two gates into
# one. `hardware_profile_id` keeps a capability from silently spanning a hardware change;
# bump it BY HAND when the box changes.
node                = "gcp-vertex"
# Null on purpose: Google does not tell us which hardware served the call, so
# there is no honest profile to pin. Capabilities formed on these rungs cannot
# distinguish pre- and post-hardware-change evidence, and should not pretend to.
project_env  = "GOOGLE_CLOUD_PROJECT"
location_env = "GOOGLE_CLOUD_LOCATION"       # defaults to "global" when unset
cost_class   = "trial"                       # A4: counts against [trial] runway
# Default output budget for this rung when a caller omits max_tokens. A THINKING
# model spends tokens on hidden reasoning before any visible text, so a stingy
# budget returns EMPTY text (ok:true, tokens burned on thought). 16384 gives real
# headroom for reasoning + a long answer. It is a CAP, not a charge — small calls
# still cost small; only tokens actually produced bill. Callers may override per
# call. The router (inference.local_generate) reads this when max_tokens is unset.
max_tokens   = 16384
# A1 payload budget: the 1M-ctx rung — effectively unlimited for door payloads.
context_bytes = 4194304
