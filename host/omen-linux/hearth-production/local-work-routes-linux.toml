version = "local-work-routes.linux-v1"

[lane.deep]
backends = ["omen-nemotron-74b", "omen-dense-27b", "omen-dense-27b-b", "am4-vllm"]
# D-seat-roles (2026-10-27, C21): code work prefers the AM4 27B, in configured priority order.
# The 74B is used when output need exceeds AM4's declared 4096-token allowance.
# Absent/unavailable seats are skipped explicitly; capacity queues on the chosen seat, never spills.
code_backends = ["am4-vllm", "omen-nemotron-74b"]
