# Invocable work exposed by HEARTH's execution control plane.
#
# Operations describe what the caller wants. Providers and models remain in
# backends.toml. Per-request policy (deadline, output budget, priority) is
# constrained by these operation-level limits.

[operation."llm.chat"]
description = "Generate a conversational completion through the HEARTH model router."
handler = "llm_chat"
default_model = "gpt-oss-120b"
max_prompt_bytes = 65536
max_tokens_ceiling = 32768
deadline_ceiling_s = 1200
artifact_media_type = "text/markdown; charset=utf-8"

[operation."inference.generate"]
description = "Compatibility operation for HEARTH's historical local_generate tool."
handler = "llm_chat"
max_prompt_bytes = 1048576
max_tokens_ceiling = 32768
deadline_ceiling_s = 1200
artifact_media_type = "text/plain; charset=utf-8"

[operation."media.render"]
description = "Render a BF6 highlight clip on a leased Arc Pro B70 QSV lane."
handler = "media_render"
# The "prompt" for a render is its JSON job spec, recorded as the input
# artifact so the ledger still shows exactly what was asked for.
max_prompt_bytes = 65536
# Not a token budget -- renders emit no tokens. Kept at the schema's minimum
# because the field is required by load_operations().
max_tokens_ceiling = 1
# A 180 s 4K clip through two variants, with headroom for a contended lane.
deadline_ceiling_s = 3600
artifact_media_type = "application/json; charset=utf-8"

[operation."image.generate"]
description = "Run a registered image workflow on a fenced Arc Pro B70 lane."
handler = "image_generate"
max_prompt_bytes = 270336
max_tokens_ceiling = 1
deadline_ceiling_s = 7200
artifact_media_type = "application/json; charset=utf-8"

[operation."media.podcast"]
description = "Generate a validated podcast script and synthesize a WAV artifact."
handler = "media_generate"
max_prompt_bytes = 270336
max_tokens_ceiling = 1
deadline_ceiling_s = 3600
artifact_media_type = "application/json; charset=utf-8"

[operation."media.animate"]
description = "Animate one caller-owned still with the fixed Wan2.1 workflow."
handler = "media_generate"
max_prompt_bytes = 29360128
max_tokens_ceiling = 1
deadline_ceiling_s = 10800
artifact_media_type = "application/json; charset=utf-8"

[operation."media.pipeline"]
description = "Compose a durable podcast and visual story from a source document."
handler = "media_generate"
max_prompt_bytes = 262144
max_tokens_ceiling = 1
deadline_ceiling_s = 86400
artifact_media_type = "application/json; charset=utf-8"
