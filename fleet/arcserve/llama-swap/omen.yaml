hooks:
  on_startup:
    preload:
      - "qwen3-30b-a3b"

routing:
  router:
    use: group
    settings:
      groups:
        "production":
          persistent: true
          swap: false
          exclusive: false
          members:
            - "qwen3-30b-a3b"
        "phi4":
          swap: true
          exclusive: false
          members:
            - "phi4-vk1"
            - "phi4-vk2"
        "qwen14b":
          swap: true
          exclusive: false
          members:
            - "qwen14b-vk1"
            - "qwen14b-vk2"
        "gptoss20b":
          swap: true
          exclusive: false
          members:
            - "gptoss20b-vk1"
            - "gptoss20b-vk2"
        "mistral24b":
          swap: true
          exclusive: false
          members:
            - "mistral24b-vk1"
            - "mistral24b-vk2"
        "qwen27b-dual":
          swap: true
          exclusive: false
          members:
            - "qwen38-27b-dual"
