# lab-configurations.v1 — named whole-lab serving configurations (ADR-0052, task 8).
#
# A lab configuration describes the expected serving shape of the entire lab:
# which profile OMEN is in, which profile AM4 is in, FX99 state, and which HEARTH
# backends are expected live or absent, with their sizing parameters.
contract = "lab-configurations.v1"
authored = "2026-10-03"

[configuration.day]
description = "Default configuration: OMEN dual-lane (27B quality + 30B MoE), AM4 tool-pair (two 8B seats on the CUDA cards: fast prefill for tool calls and rapid calls), FX99 utility"
omen_profile = "two-lane"
am4_profile = "tool-pair"
fx99_state = "live"

[configuration.day.backends]
omen-vllm = { status = "live", context_tokens = 40960, parallel_slots = 8, max_tokens = 8192 }
omen-dense-27b = { status = "live", context_tokens = 65536, parallel_slots = 2, max_tokens = 16384 }
am4-vllm = { status = "absent" }
am4-tool-4070ti = { status = "live", context_tokens = 24576, parallel_slots = 3, max_tokens = 4096 }
am4-tool-5070 = { status = "live", context_tokens = 16384, parallel_slots = 1, max_tokens = 6144 }
fx99-vllm = { status = "live", context_tokens = 4096, parallel_slots = 1, max_tokens = 1024 }
omen-perception = { status = "live", parallel_slots = 2 }

[configuration.memsplice]
description = "MemSplice research shape: OMEN dual-lane, AM4 dense-tp2 (the 27B on the CUDA pair, the prefill side of a CUDA-to-Arc KV hand-off; tool seats absent), FX99 utility"
omen_profile = "two-lane"
am4_profile = "dense-tp2"
fx99_state = "live"

[configuration.memsplice.backends]
