# The work-item policy: which gate work items exist, where each one may write,
# and what each one may never ask for (D-113 as amended; WI-G2b condition 3).
#
# This is the ONE register. `hearth/etc/operator.toml` used to carry a bare
# `[test_mode].released_work_items` list, which could say a work item was
# released while nothing said where it may write or what it may not do; a
# mode:test proposal naming it was then judged on shape alone. That list is gone
# and this file replaces it.
#
# How it is read (hearth/operator/work_items.py):
#
#   * the whole file validates against hearth/contracts/work-items.v1.schema.json
#     at load, and every entry's `digest` is RECOMPUTED — an entry edited without
#     updating its digest is refused, loudly, naming the entry;
#   * only `status = "released"` may be named by a mode:test proposal;
#   * `repository` is where `base_commit`, `base_tree` and `rollback_ref` are
#     resolved with `git cat-file` — a well-formed 40-hex id that is not an
#     object of the right type is refused;
#   * every isolated input and output must EXIST and resolve inside one of this
#     work item's `permitted_isolated_roots`, which is stricter than "outside
#     master": another work item's worktree is another writer's surface;
#   * a requested authority in `prohibited_authorities` is a policy denial
#     (`policy_block`), not something a human may approve;
#   * the digest of this file is bound into every mode:test validation result,
#     so a run records which register judged it.
#
# omen-linux 2026-09-27: repository and permitted roots point at the Linux control-plane
# checkout and its worktrees root; the Windows C:\work roots were retired with the cutover.
#
# Recompute a digest with:
#   python -c "from hearth.operator import work_items; work_items.print_digests()"

contract_version = "work-items.v1"
policy_version = "operator-work-items.v1"

[[work_item]]
id = "WI-G1"
status = "released"
title = "Entry contract: catalog, capacity snapshot, inspection, authority, CLI and door parity"
repository = '/home/derek/work/commandcenter-linux-flash'
branch = "operator/program"
permitted_isolated_roots = [
  '/home/derek/work/worktrees/commandcenter/operator-program',
  '/home/derek/work/worktrees/commandcenter/g1-entry-evidence',
]
prohibited_authorities = ["change_machine_or_network", "merge_push_deploy"]
digest = "c3056bc43d53f90e0dc17ea9000f7b90800ad1729eb3c3c252b3086745447224"

