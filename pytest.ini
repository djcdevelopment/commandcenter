# Minimal pytest configuration for commandcenter.
#
# Its only job is to make a bare `python -m pytest` from the repo root work.
# Without it, collection dies on runtime state:
#
#   PermissionError: [WinError 5] Access is denied:
#     'C:\work\commandcenter\hearth\var\mediagen\job_<id>-<slug>'
#
# hearth/var is gitignored runtime state (live mediagen/imagegen job dirs, some
# held open by a running process) and holds no tests. The standing workaround
# was `--ignore=hearth/var` on every invocation, which made "the suite is green"
# depend on how it was invoked.
#
# Use the repo's test interpreter -- system python lacks other lanes' deps:
#   fleet-worker-node\.venv-omen\Scripts\python.exe -m pytest -q
[pytest]
# WARNING: setting norecursedirs REPLACES pytest's default list, it does not
# extend it. The first nine patterns below are that default, restated verbatim
# (pytest 9.1.1). Dropping any of them silently changes what gets collected --
# in particular `.*` is the only reason `.claude/worktrees/` is skipped today,
# and those worktrees hold full copies of this repo (362 test files as of
# 2026-09-09). Losing `.*` would also pull in fleet-worker-node/.venv-omen.
#
# Only the last entry is ours. `hearth/var` contains a separator, so pytest
# matches it against the whole path, not the basename -- an unrelated `var/`
# elsewhere in the tree is still collected.
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    hearth/var
