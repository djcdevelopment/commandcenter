[[node]]
name = "omen"
kind = "physical-host"
address = "omen.mshome.net"
alt = ["100.124.12.37"]   # tailnet identity stays (i5/phone reach it from another project)
via = "mshome"
expect = "up"
purpose = "Hyper-V hypervisor + HEARTH gateway (:8710) + omen-arc rung (llama-server :8082, dual Arc Pro B70, ADR-0034, -c 131072 -np 2). The whole live inference surface of the fleet as of 2026-08-24. Hosts all builder VMs (currently all Off). THIS box."
# `revive` (optional, per-check): a shell command the watchdog runs when this
# service is down on an expect="up" node. Since ADR-0015 the watchdog is an
# in-gateway daemon timer (the old mechnet-watchdog scheduled task is deregistered).
# The gateway revive is the proven doorcheck --revive (verified 2026-07-04, 322ab7d).
# OLLAMA ON OMEN IS RETIRED (2026-08-24). ADR-0034 disabled OllamaBoot for good
# when omen-arc took over as the door default; `:11434` has not listened since.
# The `ollama-local` check was dropped here -- it is a permanent red row under
# --all-services, and a check that can never pass teaches you to ignore the sweep.
# The old two-lane note is kept below because :11435 still runs and the
# distinction still bites anyone who revives Ollama:
#   :11434 was bound to 127.0.0.1 ONLY -- OllamaBoot ran `ollama.exe serve` with
#     OLLAMA_HOST unset, so it defaulted to loopback: the HEARTH door's own lane.
#   :11435 is the FLEET-facing lane -- OmenOllamaTracingProxy (scheduled task,
#     C:\Users\derek\omen-otel-proxy\proxy.py) listens on 0.0.0.0:11435 and fronts
#     Ollama with OTel tracing. VMs MUST use :11435. The task is still Running, so
#     the port answers even though there is no Ollama behind it -- this check
#     proves the proxy, NOT a model. Do not read it as inference capacity.
# Probing omen.mshome.net:11434 only ever generates a false alarm -- it cannot answer.
checks = [
  { service = "llama-server", port = 8082, host = "127.0.0.1" },
  { service = "ollama-fleet", port = 11435, host = "omen.mshome.net" },
  { service = "hearth-gateway", port = 8710, host = "127.0.0.1", revive = "C:\\work\\commandcenter\\fleet-worker-node\\.venv-omen\\Scripts\\python.exe -m hearth.callers.doorcheck --revive" },
  # ADDED 2026-08-24. This hop died in the 08-20 rebuild and nobody noticed for
  # four days: Tailscale Funnel stayed configured and kept answering the public
  # URL -- with a 502. Nothing watched it, so "the lane is up" stayed true in the
  # map while the lane served errors. It is watched now.
  { service = "funnel-proxy", port = 8711, host = "127.0.0.1", revive = "schtasks /Run /TN HearthFunnelProxyRestart" },
]

