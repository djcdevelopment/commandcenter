# AM4 operator file share on the private machine lane.
[global]
   workgroup = WORKGROUP
   server role = standalone server
   server string = AM4 operator files

   interfaces = 127.0.0.1/8 192.168.12.233/24
   bind interfaces only = yes
   smb ports = 445
   disable netbios = yes
   server min protocol = SMB3_00
   smb encrypt = required

   security = user
   map to guest = never
   restrict anonymous = 2
   usershare allow guests = no
   hosts allow = 127.0.0.1 192.168.12.239
   hosts deny = 0.0.0.0/0

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

[AM4]
   comment = AM4 home
   path = /home/derek
   browseable = yes
   read only = no
   valid users = derek
   guest ok = no
   follow symlinks = no
   wide links = no
   veto files = /.ssh/.gnupg/.pki/.aws/.azure/.kube/.docker/.password-store/.netrc/.git-credentials/.npmrc/keyrings/Deskflow/Moonlight Game Streaming Project/
   delete veto files = no
   create mask = 0660
   directory mask = 0770
