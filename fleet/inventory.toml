# ============================================================================
# Fleet reachability inventory -- canonical, OMEN-side.
# ============================================================================
# THE source of truth for HOW to reach every node on the fleet network.
#
# Why it lives here (OMEN / C:\work\commandcenter) and not on the conductor:
# OMEN is the durable host (the Hyper-V hypervisor, always up). The conductor is
# rebuildable and can be down -- exactly when you MOST need to know what's reachable.
# OMEN is also the best vantage point: it can see the tailnet (100.x via Tailscale)
# AND its own Hyper-V VM siblings (mshome.net / 172.x) at the same time.
#
# Relationship to the conductor's fleet.json:
#   - fleet.json  = the conductor's auto-maintained BUILD-POOL view (which nodes are
#     workers/assay, mcp_ready, excluded). It churns as builds run.
#   - this file   = the stable REACHABILITY superset (addresses, how-to-reach, which
#     services should answer on which ports). It changes rarely.
# Different jobs. Don't fold one into the other.
#
# Consumed by: fleet/fleet_ping.py (health sweep CLI) and hearth/scheduler
# (builder locality, see below). Parsed with stdlib tomllib (Python 3.11+); no
# PyYAML dependency by design (repo is stdlib-only).
#
# `runner_class` (optional, per builder node): "local" | "frontier" — which token
# economy the node's build runner spends (2026-07-11). This is the OMEN-reachable
# projection of each node's ~/fleet-worker-node/runner.json (openai -> a local
# backend = "local"; no runner.json -> the worker defaults to the metered claude
# runner = "frontier"). hearth/scheduler derives machine kinds and the hindsight
# regret assay's local-vs-metered classification from it — keep it in sync when a
# node's runner.json changes.
#
# `schedulable` (optional, per builder node): may hearth/scheduler PLAN work on this
# node? Defaults to true; set `schedulable = false` to take a builder out of the
# advisory pool. This is DELIBERATELY separate from `expect` (2026-08-24). `expect`
# is fleet_ping's alarm flag -- "up" means this node's absence turns the sweep red,
# "optional" means it never does -- and an expect="optional" node may be live and
# serving right now. The scheduler used to read `expect` as availability, so the
# fleet hold below (which marked every parked VM "optional" purely for sweep
# hygiene) emptied its local pool and left only the synthetic always-on
# frontier-builder: a monitoring edit silently flipped the proposal economy from
# free local compute to metered frontier tokens. Keep the two flags distinct.
#
# Addressing model (Derek, 2026-07-02): VMs never join the tailnet -- only physical
# hosts hold tailnet identities. Same-host VMs are reached via mshome.net sibling DNS;
# off-host VMs via a ProxyJump through their tailnet-member hypervisor.
#
# Addressing model v2 (Derek, 2026-07-09, ADR-0014): MACHINE lanes never ride the
# tailnet at all. HEARTH/mechnet machine-to-machine traffic uses mshome.net (VMs)
# or the home LAN 192.168.12.0/24 (physical AM4). Tailscale remains only for
# HUMAN/roaming access (phone, i5) and the AM4 gallery Funnel — never in the
# control loop. Trigger: Tailscale SSH "check" mode blocked the conductor lane
# pending a browser re-auth (2026-07-09).
#
# --- FLEET HOLD: PARTIALLY LIFTED (2026-08-28, re-verified 2026-08-29) -------
# HISTORY: the 2026-08-24 hold parked ALL SIX Hyper-V VMs for Derek's campaign RAM
# reclaim. That is NO LONGER the state, and this header claimed otherwise for a day.
#
# LIVE NOW (verified 2026-08-29 by Get-VM + SSH): cc-conductor, claudefarm1 and
# cc-builder-1..3 are all Running and SSH-reachable; the conductor's dashboard :8080
# answers. Only cc-builder-4 is still Off (retired; holds the golden MAC). The
# gateway-side hold is likewise partial -- HEARTH_TIMERS_DISABLE is now only
# `drain,fleet_harvest,ollama-sentinel`; patrol and watchdog are re-armed, and
# ollama-sentinel is off FOR GOOD (ADR-0034).
#
# They are still marked expect="optional" ON PURPOSE. `expect` is fleet_ping's alarm
# flag, not an availability claim (see the schedulable/expect note above): these VMs
# are Derek-managed and may be parked again for RAM at any time, and expect="up" on a
# node that is deliberately off makes the sweep exit 1 forever -- which trains
# everyone to ignore the one signal that is supposed to mean something.
#
# The gate still has teeth: `omen` (the door + the resident rung) and `am4` stay
# expect="up", so the sweep goes red if the thing that actually serves dies.
#
# --- WHERE THE LOCAL BUILDERS ACTUALLY POINT (2026-08-29) -------------------
# A live sweep found every `runner_class = "local"` builder aimed at a DEAD backend,
# so the whole local task lane was dark while every node reported healthy:
#   am4-worker-1 -> am4 oxen :8090      -- answers, every model ready:false
#   cc-builder-2 -> the same oxen, over the TAILNET (also an ADR-0014 violation)
#   cc-builder-3 -> OMEN Ollama :11434  -- OllamaBoot disabled for good (ADR-0034)
# omen-arc is NOT the fix: llama-server binds 127.0.0.1:8082, so the VMs (Default
# Switch, 172.19.240.0/20, host 172.19.240.1) cannot reach it at all. fx99-ollama
# (192.168.12.220:11434) IS reachable from the VMs and was proved with a real decode,
# so cc-builder-2/3 now point there (qwen2.5-coder:7b / qwen2.5:14b; old values kept
# as ~/fleet-worker-node/runner.json.bak-2026-08-29). Proof: plan
# hearth-tasklane-revival-probe-936c001e built on both, assay 162/162.
# When llama-swap lands (ADR-0040 phase 2) it should ALSO listen on 172.19.240.1 so
# these builders get the B70 rung instead of an 8 GB sidecar.
#
# TO RE-PARK: stop the VMs and re-add drain/fleet_harvest to HEARTH_TIMERS_DISABLE.
# TO FULLY LIFT: drop HEARTH_TIMERS_DISABLE and bounce the gateway
# (HearthGatewayRestart, UAC-free). Leave `expect` alone in both cases.
# ============================================================================

