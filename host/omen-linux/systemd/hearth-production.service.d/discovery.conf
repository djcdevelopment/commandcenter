# steppewise-consul M2: HEARTH's Consul discovery adapter (read-only token; value stays in the file).
[Service]
Environment=HEARTH_DISCOVERY_CONSUL=http://127.0.0.1:8500
Environment=HEARTH_DISCOVERY_TOKEN_FILE=/home/derek/.config/consul/secrets/discovery-read.token
Environment=HEARTH_DISCOVERY_FRESHNESS_S=30
