[[loop.implementation]]
id = "am4-read-4070ti"
status = "LIVE"
entrypoint = "direct:http://192.168.12.233:8090/v1/chat/completions (facade alias am4-read-4070ti -> loopback 18085, bearer AM4_OXEN_TOKEN)"
last_evidence = "R&D lap 2, 2026-09-18: qwen2.5-14b-instruct-q4_K_M on the RTX 4070 Ti alone, 16k context, q8_0 KV"
