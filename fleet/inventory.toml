f now holds BOTH Intel Arc Pro B70s after the board swap, so a CPU-bound 4 tok/s critic VM is more redundant rather than less, and commandcenter/docs/adr#0029 already cut the standalone critic role in favor of am4-moe serving all roles. CORRECTION 2026-08-21: an earlier version of this note claimed OMEN had no B70s and an RTX 5070, read off a single partial Win32_VideoController enumeration. Verified wrong against Get-PnpDevice -- both B70s are Status OK on distinct PCI paths and the RTX 5070 record is a ghost with Present=False. HAZARD LEFT BEHIND: it still holds the original golden-image MAC 00155D0CC700, so a future clone off the golden image that does not regenerate its MAC will collide with it exactly as claudefarm1 did on 2026-07-03. HISTORY: 2026-07-09: address moved off the drift-prone NAT IP to sibling DNS (verified reachable). Found ON the tailnet (policy violation, 'Duplicate node key' badge, ts 1.98.8 = fresh install — likely a reachability workaround for the drifted NAT IP) -> removed from tailnet via admin console per VMs-never-join policy + ADR-0014. tailscaled may still run in-guest (claude has no passwordless sudo to disable it) but is inert once the node is deleted server-side."
