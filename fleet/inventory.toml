  { service = "ssh", port = 22 },
]

[[node]]
name = "cc-builder-4"
kind = "vm"
retired = true           # RETIRED 2026-08-20 (Derek's call). Block kept for history.
address = "cc-builder-4.mshome.net"
via = "mshome"
host = "omen"
# expect stays "optional", NOT "retired": fleet_ping.classify() only special-cases
# "optional", so any other value renders a permanent red DOWN row. "optional" gives
# the honest dim "offline" and never counts as a sweep failure.
expect = "optional"
runner_class = "local"   # runner.json: openai -> OMEN Ollama mixtral 8x22b
purpose = "RETIRED 2026-08-20. Was the OMEN-local Ollama MoE critic (mixtral 8x22b q2_K); exploratory-perspective only, never in the default build pool."
note = "RETIRED 2026-08-20 (VM shut down gracefully, AutomaticStartAction set to Nothing so it does not return on the next OMEN boot; VHDX left untouched pending a separate call). DIAGNOSIS 2026-08-20 -- unreachable for weeks, and the cause was never the network fabric: the guest kernel was ALIVE the whole time (Hyper-V Heartbeat OK, clock time-synced) and the vNIC was attached to the same Default Switch as everyone else, Status Ok. What it did NOT have was any L3 presence: a full ping sweep of all 4064 addresses in 172.29.64.0/20 from cc-conductor found exactly 5 guests and its MAC 00155D0CC700 was not among them, and no candidate hostname (dev-vm, zen-deepseek-1, ...) resolved -- i.e. it was not asking for DHCP at all. Meanwhile cc-builder-4.mshome.net still answered 172.21.180.59 (forward AND reverse) and survived an ipconfig /flushdns, so that record is a STALE ICS registration from an earlier Default Switch subnet generation, pointing at an address with no host route (Test-NetConnection = False). The Windows Default Switch NAT prefix regenerates across host reboots -- this node drifted 172.30.10.170 -> 172.21.182.65 (fleet.json _readdressed) -> 172.21.180.59 (DNS) -> nothing, while the other five simply re-DHCPed onto 172.29.x each time. ROOT CAUSE (the part that made it different): its console shows an Ubuntu DESKTOP GDM login for user 'Derek' -- it is not the headless fleet server image at all. It boots C:/Users/derek/VMs/zen-deepseek-1/dev-vm.vhdx, a DIFFERENT file from the C:/Users/derek/VMs/dev-vm/dev-vm.vhdx that claudefarm1 boots -- always disambiguate these two by full path. zen-deepseek-node/node.json claims it was cloned from the claudefarm1 golden base on 2026-07-03, which the desktop target and the 'Derek' account contradict. Exact guest IPv4 config is unconfirmed: reading it needs a console login as Derek's account, which no agent should do. WHY NOT WORTH REPAIRING: mixtral 8x22b q2_K measured ~4.2-4.4 tok/s (overnight-critic role only), OMEN itself now holds BOTH Intel Arc Pro B70s after the board swap, so a CPU-bound 4 tok/s critic VM is more redundant rather than less, and commandcenter/docs/adr#0029 already cut the standalone critic role in favor of am4-moe serving all roles. CORRECTION 2026-08-21: an earlier version of this note claimed OMEN had no B70s and an RTX 5070, read off a single partial Win32_VideoController enumeration. Verified wrong against Get-PnpDevice -- both B70s are Status OK on distinct PCI paths and the RTX 5070 record is a ghost with Present=False. HAZARD LEFT BEHIND: it still holds the original golden-image MAC 00155D0CC700, so a future clone off the golden image that does not regenerate its MAC will collide with it exactly as claudefarm1 did on 2026-07-03. HISTORY: 2026-07-09: address moved off the drift-prone NAT IP to sibling DNS (verified reachable). Found ON the tailnet (policy violation, 'Duplicate node key' badge, ts 1.98.8 = fresh install — likely a reachability workaround for the drifted NAT IP) -> removed from tailnet via admin console per VMs-never-join policy + ADR-0014. tailscaled may still run in-guest (claude has no passwordless sudo to disable it) but is inert once the node is deleted server-side."
checks = [
  { service = "ssh", port = 22 },
]

# --- Logical builders (a runner riding another node's shell) ----------------
# These are not machines of their own -- they run a worker shell on `rides_on`
# and point at a separate model backend. Reachability = can we reach the shell host?

[[node]]
name = "am4-worker-1"
kind = "logical-builder"
rides_on = "am4"
model_backend = "127.0.0.1:8090"   # ☠ dead: oxen stack left with the cards (2026-08-20)
via = "lan"
expect = "down"   # pending the AM4 CUDA rebuild
runner_class = "local"   # openai runner -> oxen (dual B70), AM4-local
purpose = "AM4 local-model builder: openai runner -> oxen. Shell on AM4; farmer via cc-farmer tunnel."
checks = [
  { service = "ssh", port = 22, host = "192.168.12.233" },
]

[[node]]
name = "omen-worker-1"
kind = "logical-builder"
rides_on = "claudefarm1"
model_backend = "omen.mshome.net:11435"   # Ollama qwen3-coder:30b, via the OTel tracing proxy
via = "mshome"
expect = "up"
runner_class = "local"   # openai runner -> OMEN Ollama qwen3-coder:30b
purpose = "OMEN Ollama qwen3-coder:30b builder (54.6 tok/s). Shell rides claudefarm1 -- so it dies when claudefarm1 is down, even though its model backend (OMEN) is fine."
note = "Coupling to claudefarm1 is a fragility: OMEN's Ollama is reachable independently. Candidate to re-home its shell off claudefarm1 (see CONDUCTOR-FOLLOWUPS)."
checks = [
  { service = "ssh", port = 22, host = "claudefarm1.mshome.net" },
  { service = "ollama-fleet", port = 11435, host = "omen.mshome.net" },
]

# --- Cloud backends (no machine of our own; check host = the API endpoint) --
# First cloud-backend node on the mechnet (2026-07-12). Not a machine we own --
# no address/ssh, just an inference endpoint. The TCP check proves egress/DNS
# reachability from OMEN only; auth and quota are doorcheck's job (/checkmcp
# reads hearth/etc/backends.toml's gcp-gemini entry for the deep check).

[[node]]
name = "gcp-gemini"
kind = "cloud-backend"
via  = "internet"
expect = "optional"
model_backend = "gemini-3.5-flash"
purpose = "Vertex AI overflow lane (GCP trial credits) — backends.toml gcp-gemini"
note = "TCP probe = egress/DNS only; auth+quota truth lives in /checkmcp's backends layer (doorcheck)"
checks = [{ service = "vertex-egress", host = "aiplatform.googleapis.com", port = 443 }]
