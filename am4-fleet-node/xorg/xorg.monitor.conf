# Monitor-attached X configuration for AM4's ASUS MG28U.
#
# The workstation owns one physical display on DP-0. Keep this deliberately
# single-head: adding an unassigned framebuffer or a second implicit head is
# what produced the previous black-screen/misleading-connected symptom.
# The sibling headless configuration remains the capture-only 3840x2160 mode.
Section "ServerFlags"
    Option         "BlankTime" "0"
    Option         "StandbyTime" "0"
    Option         "SuspendTime" "0"
    Option         "OffTime" "0"
EndSection

Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0" 0 0
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "PCI:9:0:0"
    Option         "AllowEmptyInitialConfiguration" "true"
    Option         "DPI" "144 x 144"
    Option         "UseEdidDpi" "FALSE"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    DefaultDepth    24
    Option         "MetaModes" "DP-0: nvidia-auto-select +0+0 {AllowGSYNC=Off}"
    SubSection     "Display"
        Depth       24
        Virtual     3840 2160
    EndSubSection
EndSection
