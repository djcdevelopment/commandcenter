# Render profiles for the BF6 highlights media lane.
#
# A profile is a VERSIONED contract. Every rendered output records the profile
# version that produced it, so a draft can always be traced back to the exact
# encoder settings behind it -- and so changing settings is a new version rather
# than a silent redefinition of the old one.
#
# What lives here: the tunables (encoder, rate control, caps).
# What does NOT live here: the filter graphs. Those are logic, not data, and
# they live in hearth/media/profiles.py where they can be tested. Pretending a
# filter graph is configuration only makes it configuration nobody validates.
#
# The audio contract is deliberately identical across both profiles and is NOT
# tunable: track gains 1.0/1.35/1.25, amix normalize=0, loudnorm I=-14:TP=-1:
# LRA=11, aresample=48000, aac 320k. It is copied verbatim from the AM4
# renderer (am4-worker/app/pipeline.py mix_filter) because preserving the mix is
# a hard compatibility requirement, not a preference.

[profile."bf6-nvenc-v1"]
description = "The AM4 RTX 5070 renderer, recorded verbatim as the comparison reference."
graph = "nvenc"
node = "am4"
# Reference only -- HEARTH does not dispatch this. It exists so the benchmark
# has a machine-readable statement of what it is comparing against.
reference_only = true

[profile."bf6-nvenc-v1".horizontal]
encoder = "h264_nvenc"
args = ["-preset", "p7", "-tune", "hq", "-cq", "18", "-b:v", "0"]
maxrate = "85M"
bufsize = "170M"
scale = false            # -map 0:v:0 passthrough; the 4K master is not resized
burn_captions = false

[profile."bf6-nvenc-v1".vertical]
encoder = "h264_nvenc"
args = ["-preset", "p7", "-tune", "hq", "-cq", "18", "-b:v", "0"]
maxrate = "24M"
bufsize = "48M"
width = 1080
height = 1920
fps = 60
burn_captions = true


[profile."bf6-qsv-v1"]
description = "Dual Arc Pro B70 QSV lane. HEVC decode, H.264 encode, GPU-approximated blur."
graph = "qsv"
node = "omen"
reference_only = false

# global_quality is the QSV analogue of NVENC's cq, but the scales are NOT
# comparable and there is no conversion formula. Values here are a first pass
# pending the full Phase 7 sweep; see max_bitrate_mbps for the size guardrail.
#
# Calibration methodology matters here. Comparing a QSV encode against the NVENC
# *output* is meaningless -- the reference is itself lossy, so SSIM saturates at
# ~0.947 no matter how many bits QSV spends. Both encoders must be compared
# against the ORIGINAL SOURCE. Measured that way over the same 20 s window, the
# NVENC reference scores SSIM 0.978265 at 63.27 Mbps; that is the number to
# match.
[profile."bf6-qsv-v1".horizontal]
encoder = "h264_qsv"
# BOUNDED MODE, chosen 2026-08-25 from a 10-clip gameplay calibration.
#
# ICQ gq=19 is quality-targeted and UNBOUNDED -- QSV ignores -maxrate in ICQ --
# and measured min 11.86 / median 80.71 / max 204.09 Mbps, with 3 of 10 clips
# over the 125 Mbps stop. A guardrail that rejects legitimate high-motion output
# is not a guardrail, and raising it to ~220 would have made it an
# extreme-outlier check while letting this path diverge from production.
#
# The right comparison was production semantics: AM4/NVENC today is
# quality-targeted AND bitrate-bounded (-cq 18 -maxrate 85M, which NVENC
# honours). QSV VBR is the equivalent bounded mode.
#
# Candidates measured source-relative against the UNCHANGED ICQ gq=19 baseline
# across the same 10 clips (median SSIM delta / max Mbps):
#     vbr 60M/85M    -0.002685   61.26
#     vbr 75M/100M   -0.001482   77.17
#     vbr 85M/125M   -0.000812   87.36   <-- chosen
#
# 85M/125M matches ICQ's median bitrate (80.50 vs 80.71) and its median quality
# to within 0.0008 SSIM, while cutting the tail from 204 -> 87 Mbps. Its MEAN
# bitrate is actually lower than ICQ's (77.73 vs 87.73): VBR spends more on easy
# content and far less on hard content. Chosen on the distribution, not the
# single worst clip.
rate_control = "vbr"
bitrate = "85M"
maxrate = "125M"
bufsize = "250M"
# Retained as the QUALITY REFERENCE, not an active setting. gq=19 measured
# slightly above the NVENC renderer source-relative (0.979264 vs 0.978265) and
# remains the yardstick any future rate-control change is judged against.
# Deliberately NOT emitted in vbr mode.
global_quality = 19
args = []
# An ANOMALY detector, not a rate control: across the sample VBR never exceeded
# 87.36 Mbps against its own 125 Mbps cap. Deliberately set ABOVE maxrate --
# a guard equal to the cap can false-fire on legitimate cap-hugging output plus
# container overhead, which would make it fail exactly the clips the cap is
# working hardest on. This firing now means the encoder did not honour maxrate.
max_bitrate_mbps = 140
scale = false
burn_captions = false
calibrated = true

[profile."bf6-qsv-v1".vertical]
encoder = "h264_qsv"
# BOUNDED MODE, chosen 2026-08-25 by the same method as horizontal.
#
# ICQ gq=20 is unbounded and a live round trip hit 38.11 Mbps against the old
# 30 Mbps guard -- the whole clip was correctly withheld by all-or-none. An
# 11-clip sample (the 10 calibration clips plus that failing window) put ICQ at
# median 15.25 / max 35.67 Mbps, 1 of 11 over 30.
#
# Candidates measured against a near-transparent CPU encode of the IDENTICAL
# filter graph -- SSIM against the 4K source is meaningless for a 1080x1920
# composite, and comparing against ICQ output would compare against something
# itself lossy. Median SSIM delta vs the unchanged ICQ gq=20 baseline / max Mbps:
#     vbr 15M/24M   -0.001640   15.21   (worse on 7/11 -- too tight)
#     vbr 20M/30M   -0.000270   20.30   <-- chosen: quality-neutral, bounded
#     vbr 25M/40M   +0.000545   25.36   (better, but +37% mean bitrate for
#                                        +0.0005 SSIM, and needs a 40M cap)
rate_control = "vbr"
bitrate = "20M"
maxrate = "30M"
bufsize = "60M"
# Retained as the quality REFERENCE, not an active setting; not emitted in vbr.
global_quality = 20
args = []
# Above the 30M cap, for the reason given on horizontal.
max_bitrate_mbps = 35
width = 1080
height = 1920
fps = 60
burn_captions = true
calibrated = true
# The blurred bed is approximated on the GPU by a staged downscale/upscale rather
# than gblur=sigma=28, which has no QSV equivalent. DELIBERATE and VISIBLE
# departure; see the plan's "Known deviations". Chosen by looking at frames:
#   68x120 straight to 1080x1920 -> a hard mosaic, not a blur
#   136x240                      -> bed stays READABLE (menu text, faces legible)
#   68x120 -> 270x480 -> 1080x1920 + denoise -> reads as a blurred bed  <-- used
# The source is also cropped to the output aspect first; scaling 16:9 straight
# into 9:16 squashes the picture, which is obvious on screen.
blur_width = 68
blur_height = 120
