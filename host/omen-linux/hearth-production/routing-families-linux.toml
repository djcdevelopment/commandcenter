# tool_execution -> the AM4 tool-pair seats (2026-09-28). Small OS-local chores (read / grep /
# summarize one file with citations) through the DeepAgents runner: Qwen3-8B-AWQ on the 4070 Ti
# accepted 6/6 chores at a 10 s median (lap 3, citation spellings normalised) where the 27B control
# took 2/6 at 172 s and blew two budgets. The tag only resolves while `am4-profile tool-pair` is
# live (the rungs' occupancy reads unknown otherwise, so the door default takes the call); the
# DeepAgents wrapper refuses an AM4 route outright when the profile is not live. No depth override:
# a depth override cannot switch a tag, and a >20K prompt does not belong on a 24K seat.
[family.tool_execution]
model_id = "am4-tool-4070ti"
tags = ["tool-use"]
evidence = "docs/rnd-log.md 2026-09-28 02:28Z: lap 3 on am4-tool-4070ti 6/6 accepted, median wall 10 s, max 25 s, 2-8 attempts; control omen-dense 2/6, median 172 s, two budget blowouts (48 and 35 attempts); per-card prefill 4070 Ti 4,379 tok/s vs 5070 3,395 tok/s on a 9,250-token prompt"
receipt = "/home/derek/work/commandcenter-linux-flash/docs/rnd-log.md"
reason = "Tool loops on one frozen file are a small-model job: the 8B finishes in seconds and the 27B thrashes; the 4070 Ti is the prefill seat, the 5070 the spill-over via the same tag."

# tool_long_output (ADR-0050, 2026-09-28): the same chores when the ANSWER is long (sizer bins l/xl:
# >= 1,024 expected output tokens -- a rewrite, a translation, an 800-word report). Decode, not
# prefill, is the cost that scales with output, and the 5070 decodes 110 tok/s to the Ti's 85, so the
# long-output tag lives on the 5070 only. Nothing declares this family by hand: the sizer refines a
# declared tool_execution to it when the request's own budget or verb says the output will be long.
[family.tool_long_output]
model_id = "am4-tool-5070"
tags = ["tool-long"]
evidence = "docs/rnd-log.md 2026-09-28 02:43Z: single-stream decode am4-tool-5070 110 tok/s vs am4-tool-4070ti 85 tok/s (3 x 512-token runs each); prefill Ti 4,379 vs 5070 3,395 tok/s -- the seats split by which phase dominates"
receipt = "/home/derek/work/commandcenter-linux-flash/docs/rnd-log.md"
reason = "Long tool output is decode-bound; the 5070 is the faster decoder, so l/xl tool work lands there and the Ti keeps the short, prefill-heavy volume."

