# Local-only workflow lanes. Explicit lanes never substitute another provider.
# v2 promotes the qualified AM4 CUDA dense seat for bounded fast work.  The
# one-slot D1 SYCL seat remains the source-backed deep route.
version = "local-work-routes.v2"

[lane.fast]
backend = "am4-dense"

[lane.deep]
backend = "omen-arc-27b"
