[Unit]
Wants=network-online.target
After=network-online.target

[Service]
# Refuse to start before AM4's fixed Wi-Fi address exists.  This prevents
# Samba from falling back to a wildcard listener during early boot.
ExecStartPre=/bin/sh -c '/usr/sbin/ip -4 address show dev wlp4s0 | /usr/bin/grep -q "192.168.12.233/24"'
